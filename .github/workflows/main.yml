name: Main

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * MON'

jobs:

  build-test-publish:
    uses: cyber-dojo-languages/reusable-actions-workflows/.github/workflows/build-image-per-arch.yml@main
    # The katas assemble x86-64 with nasm -f elf64 and link the object into a
    # binary they then run. nasm on arm64 still emits x86-64 objects, so the
    # image would build and the link would fail with "unknown architecture of
    # input file is incompatible with aarch64 output".
    with:
      arm64: false
    permissions:
      packages: write
      contents: read
